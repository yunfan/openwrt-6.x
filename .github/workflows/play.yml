name: 编译

on:
  push:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      env:
        TZ: Asia/Shanghai
        FORCE_UNSAFE_CONFIGURE: 1
        DEBIAN_FRONTEND: noninteractive
      volumes:
        - /data:/data
    steps:
    - name: 初始化的环境
      run: |
        pwd
        id
        df -h
        
    - name: 安装go与ttyshare
      run: |
        apt update -y
        apt install -y golang
        go install github.com/elisescu/tty-share@latest

    - name: 配置反向链接
      run: |
        tty-share --public
