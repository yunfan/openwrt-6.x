name: 编译

on:
  push:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      env:
        TZ: Asia/Shanghai
        FORCE_UNSAFE_CONFIGURE: 1
        DEBIAN_FRONTEND: noninteractive
      volumes:
        - /data:/data
    steps:
    - name: 初始化的环境
      run: |
        pwd
        id
        df -h
        
    - name: 安装ttyshare
      run: |
        apt update -y
        apt install -y wget
        wget --no-check-certificate 'https://github.com/elisescu/tty-share/releases/download/v2.4.1/tty-share_linux-amd64' -O /bin/tty-share
        chmod +x /bin/tty-share

    - name: 配置反向链接
      shell: 'script -q -e -c "bash {0}"'
      run: |
        tty-share --public
